# Reference template for pgbench client job.
# The matrix runner creates real jobs/exec calls with scenario-specific arguments.
apiVersion: batch/v1
kind: Job
metadata:
  name: pgbench-client-template
  namespace: default
  labels:
    app.kubernetes.io/name: benchmark-harness
spec:
  # Auto-clean finished jobs to keep benchmark namespace tidy.
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-harness
    spec:
      restartPolicy: Never
      containers:
        - name: pgbench-client
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              value: ""
          command:
            - bash
            - -lc
            - |
              echo "Template job. Actual commands are injected by scripts/run_pgbench_matrix.sh"
